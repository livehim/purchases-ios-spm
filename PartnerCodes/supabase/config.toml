# Supabase Configuration for Partner Codes System
# See: https://supabase.com/docs/guides/cli/config

[project]
id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.generate-partner-code]
verify_jwt = true

[functions.redeem-partner-code]
verify_jwt = true

[functions.check-link-status]
verify_jwt = true

[functions.sync-premium]
verify_jwt = false # Allows RevenueCat webhooks (server-to-server)
